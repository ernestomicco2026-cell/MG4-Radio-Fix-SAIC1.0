name: Build e Release

# Si avvia quando pubblichi un tag "v..." (es. v1.1), oppure a mano da Actions → "Run workflow".
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag della release da creare (es. v1.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FW_VERSION: 1.0.0_EH32_SOP_2502201114
      FW_SWI: SWI68-29958-1300R69
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decifra l'APK originale
        env:
          FIRMWARE_KEY: ${{ secrets.FIRMWARE_KEY }}
        run: |
          if [ -z "$FIRMWARE_KEY" ]; then
            echo "::error::Manca il secret FIRMWARE_KEY (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/fw"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "firmware/radioservice_${FW_VERSION}.apk.enc" \
            -out "$RUNNER_TEMP/fw/original.apk" -pass env:FIRMWARE_KEY

      - name: Costruisci e firma
        run: |
          mkdir -p dist
          cd dist
          ../patcher/build.sh "$RUNNER_TEMP/fw/original.apk"
          rm -f "$RUNNER_TEMP/fw/original.apk"
          ls -la

      - name: Prepara la descrizione
        id: notes
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          APK="RadioService_radiofix1_${FW_VERSION}.apk"
          SHA="$(sha256sum "dist/$APK" | cut -d' ' -f1)"
          echo "$SHA  $APK" > "dist/SHA256SUMS.txt"
          sed -e "s/@SHA256@/$SHA/g" -e "s/@APK@/$APK/g" -e "s/@FW_VERSION@/$FW_VERSION/g" \
              -e "s/@FW_SWI@/$FW_SWI/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=dist/$APK" >> "$GITHUB_OUTPUT"

      - name: Pubblica la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.tag }} — Radio MG4 SAIC 1.0 (${{ env.FW_SWI }})
          body_path: ${{ runner.temp }}/notes.md
          files: |
            ${{ steps.notes.outputs.apk }}
            dist/SHA256SUMS.txt
