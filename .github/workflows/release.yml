name: Build e Release

# Si avvia quando pubblichi un tag "v..." (es. v1.1), oppure a mano da Actions → "Run workflow".
# Release automatica: si avvia anche quando su main cambia il file VERSION (es. 1.6 → Release v1.6), cioè quando una
# nuova versione approvata da Ernesto viene pubblicata. Se la Release esiste già non fa niente.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['VERSION']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag della release da creare (es. v1.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FW_VERSION: 1.0.0_EH32_SOP_2502201114
      FW_SWI: SWI68-29958-1300R69 e R73
    steps:
      - uses: actions/checkout@v5

      - name: Versione e controllo
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"; else TAG="v$(tr -d ' \r\n' < VERSION)"; fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "branch" ] && [ "${{ github.event_name }}" = "push" ] && \
             gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La Release $TAG esiste già: non faccio niente."
            echo "fai=no" >> "$GITHUB_OUTPUT"
          else
            echo "fai=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.v.outputs.fai == 'si'
        with:
          distribution: temurin
          java-version: '17'

      - name: Decifra l'APK originale
        if: steps.v.outputs.fai == 'si'
        env:
          FIRMWARE_KEY: ${{ secrets.FIRMWARE_KEY }}
        run: |
          if [ -z "$FIRMWARE_KEY" ]; then
            echo "::error::Manca il secret FIRMWARE_KEY (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          # toglie spazi e a capo copiati per sbaglio insieme alla chiave
          KEY="$(printf '%s' "$FIRMWARE_KEY" | tr -d ' \t\r\n')"
          echo "Lunghezza chiave: ${#KEY} caratteri (attesi 40)"
          mkdir -p "$RUNNER_TEMP/fw"
          if ! KEY="$KEY" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
               -in "firmware/radioservice_${FW_VERSION}.apk.enc" \
               -out "$RUNNER_TEMP/fw/original.apk" -pass env:KEY; then
            echo "::error::Decifratura fallita: il secret FIRMWARE_KEY non corrisponde alla chiave usata per cifrare l'APK."
            exit 1
          fi
          echo "SHA-256 originale: $(sha256sum "$RUNNER_TEMP/fw/original.apk" | cut -d' ' -f1)"

      - name: Costruisci e firma
        if: steps.v.outputs.fai == 'si'
        run: |
          mkdir -p dist
          cd dist
          ../patcher/build.sh "$RUNNER_TEMP/fw/original.apk"
          rm -f "$RUNNER_TEMP/fw/original.apk"
          ../remover/build.sh
          ls -la

      - name: Prepara la descrizione
        if: steps.v.outputs.fai == 'si'
        id: notes
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          APK="RadioService_radiofix7_${FW_VERSION}.apk"
          SHA="$(sha256sum "dist/$APK" | cut -d' ' -f1)"
          echo "$SHA  $APK" > "dist/SHA256SUMS.txt"
          (cd dist && sha256sum RadioFixRemover_*.apk) >> "dist/SHA256SUMS.txt"
          sed -e "s/@SHA256@/$SHA/g" -e "s/@APK@/$APK/g" -e "s/@FW_VERSION@/$FW_VERSION/g" \
              -e "s/@FW_SWI@/$FW_SWI/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=dist/$APK" >> "$GITHUB_OUTPUT"

      - name: Pubblica la release
        if: steps.v.outputs.fai == 'si'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.tag }} — Radio MG4 SAIC 1.0 (${{ env.FW_SWI }})
          body_path: ${{ runner.temp }}/notes.md
          files: |
            ${{ steps.notes.outputs.apk }}
            dist/RadioFixRemover_*.apk
            dist/SHA256SUMS.txt
