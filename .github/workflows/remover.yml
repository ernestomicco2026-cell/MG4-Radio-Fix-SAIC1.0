name: Disinstallatore (Radio Fix Remover)

# Costruisce RadioFixRemover e lo aggiunge a una release già esistente.
# Avvio a mano da Actions → "Disinstallatore" → "Run workflow".
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release a cui aggiungere il disinstallatore (es. v1.0)'
        required: true
        default: 'v1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Costruisci e firma
        run: |
          mkdir -p dist && cd dist
          ../remover/build.sh
          sha256sum RadioFixRemover_*.apk

      - name: Aggiungi alla release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.inputs.tag }}" dist/RadioFixRemover_*.apk --clobber
