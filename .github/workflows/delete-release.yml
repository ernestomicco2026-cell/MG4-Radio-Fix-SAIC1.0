name: Cancella release

# Avvio a mano da Actions → "Cancella release" → "Run workflow": cancella la release e il suo tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag della release da cancellare (es. v1.5)'
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Cancella release e tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ github.event.inputs.tag }}" --repo "${{ github.repository }}" --cleanup-tag --yes
